name: eval-gate

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r aip-lab1/requirements.txt
      - name: Regression gate
        env:
          AIP_OFFLINE: "1"
          AIP_PROFILE: gemini
        run: python aip-lab1/labs/lab7/gate.py --config labs/lab7/thresholds.yml
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: aip-lab1/reports/